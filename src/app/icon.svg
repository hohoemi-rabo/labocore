<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 管理画面のファビコン: ダークのスクワークル / 白い L / スカイの点。
       色は DESIGN.md §2・§8 のトークンと同値（ground #0b0d12 / スカイ #38bdf8）。
       生徒向け（/kiroku）のアイコンは public/icons/kiroku-icon.svg で別管理。 -->
  <defs>
    <clipPath id="squircle">
      <path d="M256 0C67 0 0 67 0 256s67 256 256 256 256-67 256-256S445 0 256 0z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#0b0d12"/>
  </g>
  <!-- L letterform: round-capped strokes -->
  <path d="M174 148 V 348 H 280" fill="none" stroke="#f2f4f8"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 出欠の点。管理画面の基本アクセント（スカイ） -->
  <circle cx="336" cy="348" r="29" fill="#38bdf8"/>
</svg>
